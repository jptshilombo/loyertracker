name: CI

# Pipeline d'intégration continue (US-04) : build + tests + scans de sécurité + packaging
# Docker. Déclenché sur pull_request (toute branche) et sur push uniquement pour `main`
# (validation post-merge). Une branche de feature avec PR ouverte ne déclenche ainsi qu'un
# seul run par commit (`pull_request`) au lieu de deux (`push` + `pull_request`) : les deux
# événements produisaient sinon deux analyses SonarQube quasi simultanées du même commit, la
# seconde échouant sur la validation de concurrence interne de SonarQube (PR #131, 2026-07-01).
# Un correctif par groupe de concurrence seul (annuler le doublon) avait été tenté mais laisse
# une entrée "cancelled" sur les checks requis du commit, ce qui bloque durablement le merge
# (branch protection avec enforce_admins actif — constaté PR #132, 2026-07-01) : la suppression
# du déclenchement en double à la source est la correction retenue.
on:
  push:
    branches: [main]
  pull_request:

# Annule les exécutions obsolètes d'un nouveau push sur la même branche/PR (économie de runners).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------------
  # Portée artefacts : classification versionnée et testée du delta de la PR ou du push.
  # Le résultat ne relâche aucun contrôle qualité/sécurité ; il évite seulement de
  # reconstruire et publier les images applicatives lorsque leurs contextes sont inchangés.
  # ----------------------------------------------------------------------------------
  detect-images:
    name: Détection changements images
    runs-on: ubuntu-latest
    outputs:
      images_changed: ${{ steps.scope.outputs.images_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tester le classificateur
        run: bash infra/ci/test-artifact-scope.sh

      - name: Classifier le delta
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${GITHUB_SHA}^")"
          fi
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" |
            bash infra/ci/artifact-scope.sh >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------------------------
  # Backend : compilation, tests (dont migration Flyway via Testcontainers) + couverture.
  # ----------------------------------------------------------------------------------
  backend:
    name: Backend (build + tests + couverture)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historique complet : SonarQube a besoin du blame Git pour le code nouveau

      - name: Setup JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Verrou d'état de release (R-V54-2) : cohérence entre le compteur Flyway déclaré dans
      # infra/release/production-state.env, les fichiers de migration, la version du CHANGELOG
      # et le format du tag. Bloquant : une migration ajoutée sans mise à jour du fichier
      # d'état échoue ici, avant merge (incidents PR #77 / #171).
      - name: Verrou d'état de release
        working-directory: .
        run: bash infra/release/check-release-state.sh --ci

      # mvn verify : compile + tests (SchemaMigrationTest démarre un PostgreSQL via Docker,
      # disponible nativement sur les runners GitHub) + rapport et quality gate JaCoCo.
      - name: Build, tests et couverture
        run: mvn -B verify

      # Analyse statique SonarQube — lit le jacoco.xml déjà produit par mvn verify.
      # sonar.qualitygate.wait=true (pom.xml) : bloquant si le gate SonarQube échoue.
      # Sautée sur les PR Dependabot : GitHub ne transmet pas les secrets Actions du dépôt
      # aux workflows déclenchés par dependabot[bot] (secrets Dependabot distincts, non
      # configurés ici) — le run échouerait systématiquement en 401. Le scan a lieu quand
      # même au push sur main après merge.
      #
      # Coordonnées complètes du plugin (groupId:artifactId:goal) au lieu du préfixe
      # `sonar:sonar` : le préfixe n'est résolvable que si `org.sonarsource.scanner.maven`
      # figure dans les pluginGroups (settings.xml) OU si le plugin est déjà dans le cache
      # Maven local. Sur un cache froid/évincé, `mvn sonar:sonar` échoue en « No plugin found
      # for prefix 'sonar' » (constaté au push main post-PR #256, 2026-07-26) : donner le
      # groupId explicite rend la résolution déterministe, sans dépendre de l'état du cache.
      - name: Analyse SonarQube
        if: github.actor != 'dependabot[bot]'
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -DskipTests
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonar.loyerpro.org

      - name: Publier le rapport de couverture JaCoCo
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: error

  # ----------------------------------------------------------------------------------
  # Frontend : build de production + tests unitaires Angular (Chrome headless).
  # ----------------------------------------------------------------------------------
  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # blame Git requis pour le Quality Gate SonarQube sur le code nouveau

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      # Gate lint/format frontend (réserve R1) : ESLint v9 + angular-eslint (config plate).
      - name: Lint (ESLint)
        run: npm run lint

      - name: Build production
        run: npm run build -- --configuration production

      # Chrome est préinstallé sur ubuntu-latest ; le launcher NoSandbox (karma.conf.js)
      # est requis car le bac à sable Chrome n'est pas disponible sur les runners.
      # --code-coverage : génère coverage/loyertracker/lcov.info (lcovonly, karma.conf.js)
      # pour l'analyse SonarQube ci-dessous.
      - name: Tests unitaires (Chrome headless)
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage

      # Analyse statique SonarQube — lit le lcov.info produit par l'étape de tests.
      # sonar-project.properties : clé projet, sources, exclusions, chemin lcov.
      # sonar.qualitygate.wait=true : bloquant si le gate SonarQube échoue.
      # sonarqube-scan-action exige la variable SONAR_TOKEN (nom fixe) :
      # on mappe le secret SONAR_TOKEN_FRONTEND sur ce nom attendu par l'action.
      # Sautée sur les PR Dependabot : voir commentaire équivalent du job backend.
      #
      # v8.2.1 (depuis v6) : le scanner embarqué passe en CLI 8.x et, surtout, v8.0.0 inverse
      # le défaut de `skipSignatureVerification` — la vérification OpenPGP des binaires du
      # scanner téléchargés est désormais ACTIVE par défaut. Ce défaut durci est conservé
      # volontairement (aucun `skipSignatureVerification: true` ici). Le bump n'était pas
      # validable via la PR Dependabot #240, l'étape étant sautée pour cet acteur : il a été
      # éprouvé par cette PR, poussée depuis une branche du dépôt, où l'étape s'exécute
      # réellement contre https://sonar.loyerpro.org (serveur 26.4.0).
      - name: Analyse SonarQube
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          projectBaseDir: frontend/
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
          SONAR_HOST_URL: https://sonar.loyerpro.org

  # ----------------------------------------------------------------------------------
  # Sécurité source : scan de secrets et analyse de composition. Les images sont
  # construites une seule fois, scannées et attestées dans le job Packaging.
  # ----------------------------------------------------------------------------------
  security:
    name: Sécurité (gitleaks + SCA + Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historique complet : gitleaks scanne aussi les commits passés

      # 1. Secrets versionnés (dépôt + historique git).
      # Requiert le secret GITLEAKS_LICENSE depuis le transfert d'ownership vers
      # l'organisation CGPA-Delivery : gitleaks-action exige une licence (gratuite,
      # à obtenir sur gitleaks.io) pour tout repo appartenant à une organisation,
      # même public — gratuit et non requis restait le cas sous un compte personnel.
      - name: Gitleaks (scan de secrets)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # 2. SCA agrégé — informatif (continue-on-error) : sans clé NVD, le téléchargement de
      #    la base est lent et soumis au rate-limiting. Les gates SCA *bloquants* sont portés
      #    par Trivy : `trivy fs` sur frontend/ (npm) ci-dessous, et `trivy image` sur l'API
      #    (dépendances Java de l'artefact). Fournir NVD_API_KEY (secret) rend ce job fiable.
      - name: OWASP Dependency-Check (SCA, informatif)
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # main 2026-06-27
        with:
          project: loyertracker
          path: "."
          format: "HTML"
          args: >-
            --failOnCVSS 9
            --enableExperimental
            ${{ secrets.NVD_API_KEY && format('--nvdApiKey {0}', secrets.NVD_API_KEY) || '' }}

      - name: Publier le rapport SCA
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-check-report
          path: reports/

      # 3. SCA npm bloquant — scanne le lockfile frontend (Trivy fs), même politique de
      #    sévérité que le scan d'image. Comble la couverture npm que l'image API (Nginx +
      #    fichiers statiques, sans paquets npm dans le runtime) ne porte pas.
      - name: Trivy (scan dépendances npm)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "frontend"
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

  # ----------------------------------------------------------------------------------
  # Supply chain : chaque image est construite une seule fois, puis cette image exacte est
  # scannée, documentée par SBOM, publiée sans écrasement, signée et attestée. Sur PR, le job
  # s'arrête après build/scan/SBOM ; aucune permission de publication n'est alors utilisée.
  # ----------------------------------------------------------------------------------
  docker-build:
    name: Build, scan et SBOM Docker
    needs: [detect-images, backend, frontend, security]
    if: needs.detect-images.outputs.images_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REGISTRY: ghcr.io
      IMAGE_BASE: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag court du commit
        id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          bash infra/ci/test-supply-chain.sh

      - name: Build unique image API
        run: docker build -t loyertracker-api:${{ steps.meta.outputs.tag }} ./backend

      - name: Scan image API exacte
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: loyertracker-api:${{ steps.meta.outputs.tag }}
          scanners: "vuln,secret"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: SBOM SPDX image API exacte
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: loyertracker-api:${{ steps.meta.outputs.tag }}
          format: spdx-json
          output: sbom-api.spdx.json

      - name: Build unique image Web
        run: docker build -f frontend/Dockerfile -t loyertracker-web:${{ steps.meta.outputs.tag }} .

      - name: Scan image Web exacte
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: loyertracker-web:${{ steps.meta.outputs.tag }}
          scanners: "vuln,secret"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: SBOM SPDX image Web exacte
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: loyertracker-web:${{ steps.meta.outputs.tag }}
          format: spdx-json
          output: sbom-web.spdx.json

      - name: Exporter les images exactes sans reconstruction
        run: |
          docker save --output loyertracker-images.tar \
            "loyertracker-api:${{ steps.meta.outputs.tag }}" \
            "loyertracker-web:${{ steps.meta.outputs.tag }}"

      - name: Transférer les images et SBOM vers la publication contrôlée
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-build-${{ github.run_id }}
          path: |
            loyertracker-images.tar
            sbom-api.spdx.json
            sbom-web.spdx.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-images:
    name: Publication, signatures et attestations
    needs: [detect-images, docker-build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-images.outputs.images_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      REGISTRY: ghcr.io
      IMAGE_BASE: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Télécharger les images exactes et les SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: supply-chain-build-${{ github.run_id }}

      - name: Charger les images sans reconstruction
        run: docker load --input loyertracker-images.tar

      - name: Tag court du commit
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Connexion à GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier image API sans écrasement
        id: publish-api
        run: |
          digest="$(bash infra/ci/supply-chain.sh publish \
            "loyertracker-api:${{ steps.meta.outputs.tag }}" \
            "$IMAGE_BASE/loyertracker-api" "${{ steps.meta.outputs.tag }}")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Publier image Web sans écrasement
        id: publish-web
        run: |
          digest="$(bash infra/ci/supply-chain.sh publish \
            "loyertracker-web:${{ steps.meta.outputs.tag }}" \
            "$IMAGE_BASE/loyertracker-web" "${{ steps.meta.outputs.tag }}")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Installer Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Signer et vérifier les images par digest
        env:
          API_DIGEST: ${{ steps.publish-api.outputs.digest }}
          WEB_DIGEST: ${{ steps.publish-web.outputs.digest }}
          COSIGN_YES: "true"
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          for ref in \
            "$IMAGE_BASE/loyertracker-api@$API_DIGEST" \
            "$IMAGE_BASE/loyertracker-web@$WEB_DIGEST"; do
            cosign sign "$ref"
            cosign verify \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" \
              "$ref"
          done

      - name: Attester provenance API
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.IMAGE_BASE }}/loyertracker-api
          subject-digest: ${{ steps.publish-api.outputs.digest }}
          push-to-registry: true

      - name: Attester SBOM API
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.IMAGE_BASE }}/loyertracker-api
          subject-digest: ${{ steps.publish-api.outputs.digest }}
          sbom-path: sbom-api.spdx.json
          push-to-registry: true

      - name: Attester provenance Web
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.IMAGE_BASE }}/loyertracker-web
          subject-digest: ${{ steps.publish-web.outputs.digest }}
          push-to-registry: true

      - name: Attester SBOM Web
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-name: ${{ env.IMAGE_BASE }}/loyertracker-web
          subject-digest: ${{ steps.publish-web.outputs.digest }}
          sbom-path: sbom-web.spdx.json
          push-to-registry: true

      - name: Vérifier les attestations GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_DIGEST: ${{ steps.publish-api.outputs.digest }}
          WEB_DIGEST: ${{ steps.publish-web.outputs.digest }}
        run: |
          for ref in \
            "oci://$IMAGE_BASE/loyertracker-api@$API_DIGEST" \
            "oci://$IMAGE_BASE/loyertracker-web@$WEB_DIGEST"; do
            gh attestation verify "$ref" -R "$GITHUB_REPOSITORY"
            gh attestation verify "$ref" -R "$GITHUB_REPOSITORY" \
              --predicate-type https://spdx.dev/Document/v2.3
          done

      - name: Générer le manifeste de release vérifié
        env:
          API_DIGEST: ${{ steps.publish-api.outputs.digest }}
          WEB_DIGEST: ${{ steps.publish-web.outputs.digest }}
        run: |
          bash infra/ci/supply-chain.sh manifest release-manifest.json \
            "$GITHUB_SHA" "${{ steps.meta.outputs.tag }}" \
            "$IMAGE_BASE/loyertracker-api@$API_DIGEST" \
            "$IMAGE_BASE/loyertracker-web@$WEB_DIGEST" \
            sbom-api.spdx.json sbom-web.spdx.json \
            "$GITHUB_WORKFLOW_REF" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq . release-manifest.json

      - name: Conserver les preuves supply-chain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-release-${{ github.run_id }}
          path: |
            sbom-api.spdx.json
            sbom-web.spdx.json
            release-manifest.json
          if-no-files-found: error
          retention-days: 90
