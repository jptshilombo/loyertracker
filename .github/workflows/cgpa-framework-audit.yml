name: CGPA Framework Audit

on:
  pull_request:
  push:
    branches:
      - main
      - "cgpa-v6.1.1-*"
      - "migration/cgpa-v6.1.1-*"

permissions:
  contents: read

jobs:
  structural-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Run CGPA structural audit
        run: >-
          python tools/cgpa_audit.py
          --format markdown
          --output cgpa-audit-report.md

      - name: Publish audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cgpa-framework-audit
          path: cgpa-audit-report.md
          if-no-files-found: error
